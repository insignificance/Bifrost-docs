## 背景：iOS应用的模块化困境

### 问题场景

想象你正在开发一个电商App，随着业务发展，App变得越来越复杂：

- **首页模块**：展示商品推荐、活动banner
- **商品模块**：商品详情、商品列表
- **购物车模块**：管理购物车、结算
- **订单模块**：订单列表、订单详情

### 传统开发方式的问题

在传统的iOS开发中，模块之间通常是这样相互调用的：

\`\`\`mermaid
graph TD
    A[首页模块] -->|直接import| B[商品模块]
    A -->|直接import| C[购物车模块]
    B -->|直接import| C
    C -->|直接import| D[订单模块]
    D -->|直接import| B

    style A fill:#ff6b6b
    style B fill:#ff6b6b
    style C fill:#ff6b6b
    style D fill:#ff6b6b
\`\`\`

**这会导致什么问题？**

1. **代码耦合严重**
   - 首页模块要使用商品详情，必须 \`#import "GoodsDetailViewController.h"\`
   - 一旦商品模块的代码出错，首页模块也无法编译

2. **循环依赖**
   - 商品模块需要跳转到购物车
   - 购物车需要显示商品信息
   - 形成循环依赖，导致编译困难

3. **团队协作困难**
   - 张三负责商品模块，李四负责购物车模块
   - 李四的代码依赖张三的代码，张三还没写完，李四就无法编译测试

4. **无法独立开发**
   - 想单独测试购物车模块？不行，必须把所有依赖的模块都编译进来

## Bifrost是什么

**Bifrost** 是一个iOS业务模块化架构库（Business Modular Architecture Library）。

### 名字的由来

Bifrost（彩虹桥）来自北欧神话和漫威电影《雷神》：
- 在神话中，Bifrost是连接人间和神界的彩虹桥
- 人们可以通过这座桥瞬间到达任何地方
- 在我们的架构中，Bifrost让模块之间可以"瞬间通信"，而不需要直接依赖

\`\`\`mermaid
graph LR
    A[模块A] -.->|通过Bifrost| X[Bifrost<br/>彩虹桥]
    X -.->|通过Bifrost| B[模块B]

    style X fill:#4ecdc4,stroke:#333,stroke-width:4px
    style A fill:#95e1d3
    style B fill:#95e1d3
\`\`\`

### 核心理念

**解耦业务模块之间的代码依赖，但保留业务依赖**

- ❌ **代码依赖**：A模块的代码必须import B模块的头文件才能编译
- ✅ **业务依赖**：A模块的业务逻辑需要B模块提供的功能

Bifrost的目标是：**消除代码依赖，保留业务依赖**

## Bifrost解决了什么问题

### 1. 消除模块间的代码依赖

使用Bifrost后，模块之间不再直接import：

\`\`\`mermaid
graph TD
    subgraph "业务模块层"
        A[首页模块]
        B[商品模块]
        C[购物车模块]
        D[订单模块]
    end

    subgraph "中介层"
        M[Mediator<br/>中介者]
    end

    subgraph "公共层"
        COM[Common<br/>公共组件]
    end

    A --> M
    B --> M
    C --> M
    D --> M

    A --> COM
    B --> COM
    C --> COM
    D --> COM

    style M fill:#ffd93d
    style COM fill:#6bcf7f
    style A fill:#95e1d3
    style B fill:#95e1d3
    style C fill:#95e1d3
    style D fill:#95e1d3
\`\`\`

**关键点：**
- 业务模块之间没有任何箭头连接（没有代码依赖）
- 所有模块只依赖Mediator和Common
- 模块可以独立编译和测试

### 2. 支持独立开发和测试

\`\`\`mermaid
sequenceDiagram
    participant Dev1 as 开发者A<br/>(商品模块)
    participant Dev2 as 开发者B<br/>(购物车模块)
    participant Mediator as Mediator

    Note over Dev1,Dev2: 并行开发，互不影响

    Dev1->>Mediator: 1. 定义商品模块接口
    Dev2->>Mediator: 2. 定义购物车模块接口

    Note over Dev1: 开发商品模块<br/>不需要购物车代码
    Note over Dev2: 开发购物车模块<br/>不需要商品代码

    Dev1->>Dev1: 3. 实现商品模块
    Dev2->>Dev2: 4. 实现购物车模块

    Note over Dev1,Dev2: 集成时通过Mediator通信
\`\`\`

### 3. 提供两种通信方式

Bifrost提供两种模块间通信方式：

#### 方式1：Router URL（路由URL）
适用于页面跳转和简单参数传递

\`\`\`objective-c
// 跳转到商品详情页
NSString *url = @"//goods/detail?id=12345";
UIViewController *vc = [Bifrost handleURL:url];
[self.navigationController pushViewController:vc animated:YES];
\`\`\`

#### 方式2：Remote API（远程API）
适用于复杂数据交互和方法调用

\`\`\`objective-c
// 获取商品信息
id<GoodsProtocol> goods = [BFModule(GoodsModuleService) goodsById:@"12345"];
NSLog(@"商品名称：%@", goods.name);
\`\`\`

## 传统架构 vs Bifrost架构

### 传统架构：网状依赖

\`\`\`mermaid
graph TD
    A[首页] --> B[商品]
    A --> C[购物车]
    A --> D[订单]
    B --> C
    B --> D
    C --> D
    D --> B

    style A fill:#ff6b6b
    style B fill:#ff6b6b
    style C fill:#ff6b6b
    style D fill:#ff6b6b

    classDef problem fill:#ff6b6b,stroke:#c92a2a,stroke-width:2px
\`\`\`

**问题：**
- 🔴 模块间相互依赖，形成网状结构
- 🔴 一个模块出错，影响其他模块编译
- 🔴 无法独立开发和测试
- 🔴 代码修改影响范围大

### Bifrost架构：星型依赖

\`\`\`mermaid
graph TD
    subgraph "业务模块（独立）"
        A[首页模块]
        B[商品模块]
        C[购物车模块]
        D[订单模块]
    end

    subgraph "中介层"
        M[Mediator]
    end

    subgraph "基础层"
        COM[Common]
        BF[Bifrost库]
    end

    A --> M
    B --> M
    C --> M
    D --> M

    M --> BF

    A --> COM
    B --> COM
    C --> COM
    D --> COM

    COM --> BF

    style M fill:#ffd93d
    style BF fill:#4ecdc4
    style COM fill:#6bcf7f
    style A fill:#95e1d3
    style B fill:#95e1d3
    style C fill:#95e1d3
    style D fill:#95e1d3
\`\`\`

**优势：**
- ✅ 业务模块完全解耦，可独立编译
- ✅ 通过Mediator定义清晰的模块接口
- ✅ 支持并行开发，提高团队效率
- ✅ 模块可插拔，易于维护和扩展

---

## 适用场景

### ✅ 适合使用Bifrost的项目

1. **中大型iOS应用**
   - 业务模块较多（3个以上）
   - 团队规模较大（3人以上）
   - 需要长期维护和迭代

2. **业务领域相对稳定**
   - 可以清晰划分业务模块（如：首页、商品、订单、用户等）
   - 模块边界不会频繁变化

3. **多团队协作**
   - 不同团队负责不同模块
   - 需要并行开发，减少相互等待

### ❌ 不适合使用Bifrost的项目

1. **小型应用**
   - 功能简单，模块少（1-2个）
   - 引入Bifrost反而增加复杂度

2. **业务频繁变化**
   - 模块边界不清晰
   - 业务逻辑经常重构

3. **单人开发**
   - 没有团队协作需求
   - 模块化收益不明显

        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            backToTop.classList.toggle('show', window.pageYOffset > 300);
        });
        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 修复锚点跳转 - 考虑固定头部的高度
        function scrollToAnchor(target) {
            const headerOffset = 80; // 固定头部高度 + 额外间距
            const elementPosition = target.getBoundingClientRect().top;
            const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

            window.scrollTo({
                top: offsetPosition,
                behavior: 'smooth'
            });
        }

        // 处理所有锚点链接点击
        document.addEventListener('click', function(e) {
            const target = e.target.closest('a[href^="#"]');
            if (target) {
                e.preventDefault();
                const id = target.getAttribute('href').substring(1);
                const element = document.getElementById(id);
                if (element) {
                    scrollToAnchor(element);
                    // 更新URL但不跳转
                    history.pushState(null, null, '#' + id);
                }
            }
        });

        // 页面加载时处理URL中的锚点
        window.addEventListener('DOMContentLoaded', function() {
            if (window.location.hash) {
                setTimeout(() => {
                    const id = window.location.hash.substring(1);
                    const element = document.getElementById(id);
                    if (element) {
                        scrollToAnchor(element);
                    }
                }, 100);
            }
        });
    </script>
