## 业务模块 vs 功能模块

在开始使用Bifrost之前，我们需要理解两个重要概念：**业务模块**和**功能模块**。

### 功能模块（Function Module）

**定义：** 提供通用功能的代码库，不包含具体业务逻辑。

\`\`\`mermaid
graph LR
    subgraph "功能模块示例"
        A[AFNetworking<br/>网络请求]
        B[SDWebImage<br/>图片加载]
        C[Masonry<br/>布局]
        D[YYModel<br/>数据模型]
    end

    style A fill:#a8dadc
    style B fill:#a8dadc
    style C fill:#a8dadc
    style D fill:#a8dadc
\`\`\`

**特点：**
- ✅ 可以在任何App中使用
- ✅ 提供大量公开API
- ✅ 通过直接import头文件使用
- ✅ 不包含业务逻辑

**使用方式：**
\`\`\`objective-c
// 直接import功能模块的头文件
#import <AFNetworking/AFNetworking.h>
#import <SDWebImage/UIImageView+WebCache.h>

// 直接调用API
[imageView sd_setImageWithURL:url];
\`\`\`

### 业务模块（Business Module）

**定义：** 包含具体业务逻辑的模块，只能在特定App中使用。

\`\`\`mermaid
graph LR
    subgraph "业务模块示例（电商App）"
        A[商品模块<br/>Goods]
        B[订单模块<br/>Order]
        C[购物车模块<br/>Cart]
        D[用户模块<br/>User]
    end

    style A fill:#ffd93d
    style B fill:#ffd93d
    style C fill:#ffd93d
    style D fill:#ffd93d
\`\`\`

**特点：**
- ⚠️ 只能在特定App中使用（如电商App）
- ⚠️ 只暴露少量API给其他模块
- ⚠️ 不能直接import其他业务模块
- ⚠️ 包含大量业务逻辑

**传统方式的问题：**
\`\`\`objective-c
// ❌ 错误：业务模块不应该直接import其他业务模块
#import "GoodsDetailViewController.h"
#import "ShoppingCartManager.h"

// 这会导致代码耦合
\`\`\`

**Bifrost方式：**
\`\`\`objective-c
// ✅ 正确：通过Bifrost通信
UIViewController *vc = [Bifrost handleURL:@"//goods/detail?id=123"];
id<GoodsProtocol> goods = [BFModule(GoodsModuleService) goodsById:@"123"];
\`\`\`

### 对比总结

| 特性 | 功能模块 | 业务模块 |
|------|---------|---------|
| **通用性** | 可用于任何App | 只能用于特定App |
| **API数量** | 大量公开API | 少量对外接口 |
| **使用方式** | 直接import | 通过Bifrost通信 |
| **业务逻辑** | 无业务逻辑 | 包含业务逻辑 |
| **依赖方式** | 代码依赖 | 业务依赖（通过Bifrost） |

## 代码依赖 vs 业务依赖

理解这两种依赖的区别是掌握Bifrost的关键。

### 代码依赖（Code Dependency）

**定义：** A模块必须import B模块的头文件才能编译通过。

\`\`\`mermaid
graph LR
    A[购物车模块] -->|#import GoodsModel.h| B[商品模块]

    style A fill:#ff6b6b
    style B fill:#ff6b6b

    classDef bad fill:#ff6b6b,stroke:#c92a2a
\`\`\`

**示例：**
\`\`\`objective-c
// 在 ShoppingCartViewController.m 中
#import "GoodsModel.h"  // 代码依赖

@implementation ShoppingCartViewController

- (void)showGoodsDetail {
    GoodsModel *goods = [[GoodsModel alloc] init];  // 必须有GoodsModel.h才能编译
    // ...
}

@end
\`\`\`

**问题：**
- 🔴 如果商品模块代码有错误，购物车模块也无法编译
- 🔴 必须同时拥有两个模块的代码才能开发
- 🔴 形成强耦合，难以维护

### 业务依赖（Business Dependency）

**定义：** A模块的业务逻辑需要B模块提供的功能，但不需要import B模块的代码。

\`\`\`mermaid
graph LR
    A[购物车模块] -.->|业务需要商品信息| B[商品模块]
    A -->|代码依赖| M[Mediator]
    B -->|代码依赖| M

    style A fill:#95e1d3
    style B fill:#95e1d3
    style M fill:#ffd93d
\`\`\`

**示例：**
\`\`\`objective-c
// 在 ShoppingCartViewController.m 中
#import "GoodsModuleService.h"  // 只import协议，不import具体实现

@implementation ShoppingCartViewController

- (void)showGoodsDetail {
    // 通过协议获取商品信息，不需要知道GoodsModel的具体实现
    id<GoodsProtocol> goods = [BFModule(GoodsModuleService) goodsById:@"123"];
    NSLog(@"%@", goods.name);  // 使用协议定义的方法
}

@end
\`\`\`

**优势：**
- ✅ 购物车模块可以独立编译（即使商品模块有错误）
- ✅ 只需要协议定义，不需要具体实现
- ✅ 松耦合，易于维护

### Bifrost的目标

\`\`\`mermaid
graph TD
    A[传统方式] -->|代码依赖 + 业务依赖| B[强耦合]
    C[Bifrost方式] -->|只有业务依赖| D[松耦合]

    style A fill:#ff6b6b
    style B fill:#ff6b6b
    style C fill:#95e1d3
    style D fill:#95e1d3
\`\`\`

**核心理念：** 消除代码依赖，保留业务依赖

## Bifrost三层架构

Bifrost采用三层架构设计，每一层都有明确的职责。

### 架构全景图

\`\`\`mermaid
graph TB
    subgraph "第一层：业务模块层（Business Modules）"
        A[首页模块<br/>Home]
        B[商品模块<br/>Goods]
        C[购物车模块<br/>Cart]
        D[订单模块<br/>Order]
    end

    subgraph "第二层：中介层（Mediator）"
        M1[HomeModuleService.h]
        M2[GoodsModuleService.h]
        M3[CartModuleService.h]
        M4[OrderModuleService.h]
    end

    subgraph "第三层：公共层（Common + Bifrost）"
        COM[Common<br/>公共组件]
        BF[Bifrost<br/>核心库]
    end

    A -.->|实现| M1
    B -.->|实现| M2
    C -.->|实现| M3
    D -.->|实现| M4

    A -->|依赖| M2
    A -->|依赖| M3
    C -->|依赖| M2

    A --> COM
    B --> COM
    C --> COM
    D --> COM

    COM --> BF
    M1 --> BF
    M2 --> BF
    M3 --> BF
    M4 --> BF

    style A fill:#95e1d3
    style B fill:#95e1d3
    style C fill:#95e1d3
    style D fill:#95e1d3
    style M1 fill:#ffd93d
    style M2 fill:#ffd93d
    style M3 fill:#ffd93d
    style M4 fill:#ffd93d
    style COM fill:#6bcf7f
    style BF fill:#4ecdc4
\`\`\`

### 第一层：业务模块层

**职责：** 实现具体的业务逻辑

**特点：**
- 每个业务模块是独立的
- 模块之间没有直接依赖
- 每个模块包含两个target：
  - **代码target**：静态库（.a）
  - **资源target**：资源包（.bundle）

**模块结构示例：**
\`\`\`
Goods/                          # 商品模块
├── Goods/                      # 代码target
│   ├── Module/                 # 模块入口
│   │   ├── GoodsModule.h       # 模块类
│   │   └── GoodsModule.m
│   ├── Feature/                # 功能实现
│   │   ├── GoodsList/          # 商品列表
│   │   └── GoodsDetail/        # 商品详情
│   └── Common/                 # 模块内公共代码
└── GoodsBundle/                # 资源target
    └── Resource/               # 图片、音频等资源
\`\`\`

### 第二层：中介层（Mediator）

**职责：** 定义模块之间的通信协议

**特点：**
- 包含所有业务模块的\`*ModuleService.h\`文件
- 只有协议定义，没有具体实现
- 所有业务模块都依赖Mediator

**ModuleService文件结构：**
\`\`\`objective-c
// GoodsModuleService.h

#pragma mark - URL routers
// 定义路由URL常量
static NSString *const kRouteGoodsDetail = @"//goods/detail";

#pragma mark - Model Protocols
// 定义数据模型协议
@protocol GoodsProtocol <NSObject>
- (NSString*)goodsId;
- (NSString*)name;
- (CGFloat)price;
@end

#pragma mark - Module Protocol
// 定义模块服务协议
@protocol GoodsModuleService <NSObject>
- (NSArray<id<GoodsProtocol>>*)allGoodsList;
- (id<GoodsProtocol>)goodsById:(NSString*)goodsId;
@end
\`\`\`

**为什么需要Mediator？**

\`\`\`mermaid
sequenceDiagram
    participant Cart as 购物车模块
    participant Mediator as Mediator
    participant Goods as 商品模块

    Note over Cart: 需要获取商品信息
    Cart->>Mediator: 1. import GoodsModuleService.h
    Note over Cart: 看到协议定义
    Cart->>Goods: 2. 通过Bifrost调用
    Goods->>Cart: 3. 返回商品数据

    Note over Cart,Goods: 购物车只依赖协议，不依赖商品模块代码
\`\`\`

### 第三层：公共层

包含两个部分：

#### Common（公共组件）

**职责：** 提供所有模块共用的功能

**包含内容：**
- 第三方库（AFNetworking、YYModel等）
- 公共UI组件
- 工具类
- 基础数据模型

#### Bifrost（核心库）

**职责：** 提供模块通信能力

**核心功能：**
- 模块注册与管理
- Router URL路由
- Remote API调用
- 异常处理

## 模块协议：BifrostModuleProtocol

每个业务模块都必须实现\`BifrostModuleProtocol\`协议。

### 协议定义

\`\`\`objective-c
@protocol BifrostModuleProtocol <UIApplicationDelegate, NSObject>

@required
// 必须实现：单例方法
+ (instancetype)sharedInstance;

// 必须实现：模块初始化方法
- (void)setup;

@optional
// 可选：模块优先级（默认100）
+ (NSUInteger)priority;

// 可选：是否同步初始化（默认NO）
+ (BOOL)setupModuleSynchronously;

@end
\`\`\`

### 协议方法详解

\`\`\`mermaid
graph TD
    A[BifrostModuleProtocol] --> B[必须实现]
    A --> C[可选实现]

    B --> B1[+sharedInstance<br/>单例方法]
    B --> B2[-setup<br/>初始化方法]

    C --> C1[+priority<br/>优先级]
    C --> C2[+setupModuleSynchronously<br/>同步初始化]

    style A fill:#4ecdc4
    style B fill:#ff6b6b
    style C fill:#ffd93d
\`\`\`

#### 1. sharedInstance（必须实现）

**作用：** 返回模块的单例实例

**实现示例：**
\`\`\`objective-c
+ (instancetype)sharedInstance {
    static GoodsModule *instance = nil;
    static dispatch_once_t onceToken;
    dispatch_once(&onceToken, ^{
        instance = [[self alloc] init];
    });
    return instance;
}
\`\`\`

#### 2. setup（必须实现）

**作用：** 模块初始化，在App启动时被调用

**实现示例：**
\`\`\`objective-c
- (void)setup {
    // 初始化模块
    [[GoodsManager sharedInstance] setup];

    // 注册通知
    [[NSNotificationCenter defaultCenter] addObserver:self
                                             selector:@selector(handleNotification:)
                                                 name:@"SomeNotification"
                                               object:nil];
}
\`\`\`

**注意：** 默认在后台线程异步执行，避免阻塞App启动

#### 3. priority（可选实现）

**作用：** 控制模块初始化顺序，数字越大优先级越高

**实现示例：**
\`\`\`objective-c
+ (NSUInteger)priority {
    return 200;  // 默认是100
}
\`\`\`

**使用场景：**
- 用户模块需要最先初始化（priority = 200）
- 其他模块依赖用户信息（priority = 100）

#### 4. setupModuleSynchronously（可选实现）

**作用：** 控制是否在主线程同步初始化

**实现示例：**
\`\`\`objective-c
+ (BOOL)setupModuleSynchronously {
    return YES;  // 在主线程同步初始化
}
\`\`\`

**使用场景：**
- 模块初始化必须在主线程（如UI相关）
- 模块初始化必须在其他模块之前完成

## 模块注册机制

### 注册流程

\`\`\`mermaid
sequenceDiagram
    participant App as App启动
    participant Load as +load方法
    participant Bifrost as Bifrost
    participant Module as 模块实例

    App->>Load: 1. 执行所有+load方法
    Load->>Bifrost: 2. BFRegister(GoodsModuleService)
    Note over Bifrost: 记录：GoodsModuleService -> GoodsModule

    App->>Bifrost: 3. [Bifrost setupAllModules]
    Bifrost->>Module: 4. [[GoodsModule sharedInstance] setup]
    Note over Module: 模块初始化完成

    Note over App,Module: 现在可以使用模块了
\`\`\`

### 注册代码示例

\`\`\`objective-c
// GoodsModule.m

@implementation GoodsModule

// 步骤1：在+load方法中注册
+ (void)load {
    BFRegister(GoodsModuleService);
    // 展开后：[Bifrost registerService:@protocol(GoodsModuleService)
    //                        withModule:self.class];
}

// 步骤2：实现单例方法
+ (instancetype)sharedInstance {
    static GoodsModule *instance = nil;
    static dispatch_once_t onceToken;
    dispatch_once(&onceToken, ^{
        instance = [[self alloc] init];
    });
    return instance;
}

// 步骤3：实现setup方法
- (void)setup {
    NSLog(@"商品模块初始化");
}

// 步骤4：实现ModuleService协议的方法
- (NSArray<id<GoodsProtocol>>*)allGoodsList {
    // 返回商品列表
    return @[];
}

@end
\`\`\`

### 在AppDelegate中初始化

\`\`\`objective-c
// AppDelegate.m

- (BOOL)application:(UIApplication *)application
    willFinishLaunchingWithOptions:(NSDictionary *)launchOptions {

    // 初始化所有已注册的模块
    [Bifrost setupAllModules];

    return YES;
}
\`\`\`

### 注册机制原理

\`\`\`mermaid
graph LR
    A[+load方法] -->|BFRegister| B[注册表]
    B -->|存储映射| C[Protocol -> ModuleClass]
    D[setupAllModules] -->|读取注册表| B
    D -->|创建实例| E[Module Instance]
    D -->|调用setup| E

    style A fill:#95e1d3
    style B fill:#ffd93d
    style C fill:#ffd93d
    style D fill:#4ecdc4
    style E fill:#6bcf7f
\`\`\`

**关键点：**
1. \`+load\`方法在App启动时自动执行
2. 注册时只记录协议和类的映射关系
3. \`setupAllModules\`时才真正创建模块实例
4. 按优先级顺序初始化模块

## 两种通信方式

Bifrost提供两种模块间通信方式，适用于不同场景。

### 方式对比

\`\`\`mermaid
graph TD
    A[模块间通信] --> B[Router URL<br/>路由URL]
    A --> C[Remote API<br/>远程API]

    B --> B1[适用场景]
    B1 --> B11[页面跳转]
    B1 --> B12[简单参数传递]
    B1 --> B13[跨平台URL]

    C --> C1[适用场景]
    C1 --> C11[复杂数据交互]
    C1 --> C12[方法调用]
    C1 --> C13[获取数据]

    style B fill:#ffd93d
    style C fill:#4ecdc4
\`\`\`

### Router URL（路由URL）

**特点：**
- 基于URL字符串
- 适合页面跳转
- 可以跨平台使用（H5、Android）

**示例：**
\`\`\`objective-c
// 跳转到商品详情页
NSString *url = @"//goods/detail?id=12345&from=home";
UIViewController *vc = [Bifrost handleURL:url];
[self.navigationController pushViewController:vc animated:YES];
\`\`\`

**工作流程：**
\`\`\`mermaid
sequenceDiagram
    participant Caller as 调用方
    participant Bifrost as Bifrost
    participant Handler as URL Handler
    participant VC as ViewController

    Caller->>Bifrost: handleURL:@"//goods/detail?id=123"
    Bifrost->>Bifrost: 解析URL和参数
    Bifrost->>Handler: 调用绑定的Handler Block
    Handler->>VC: 创建ViewController
    VC->>Bifrost: 返回VC实例
    Bifrost->>Caller: 返回VC
    Caller->>Caller: push ViewController
\`\`\`

### Remote API（远程API）

**特点：**
- 基于协议和方法调用
- 适合复杂数据交互
- 类型安全

**示例：**
\`\`\`objective-c
// 获取商品信息
id<GoodsProtocol> goods = [BFModule(GoodsModuleService) goodsById:@"12345"];
NSLog(@"商品名称：%@，价格：%.2f", goods.name, goods.price);

// 获取商品列表
NSArray<id<GoodsProtocol>>* list = [BFModule(GoodsModuleService) allGoodsList];
\`\`\`

**工作流程：**
\`\`\`mermaid
sequenceDiagram
    participant Caller as 调用方
    participant Bifrost as Bifrost
    participant Module as 模块实例

    Caller->>Bifrost: BFModule(GoodsModuleService)
    Bifrost->>Bifrost: 查找注册的模块类
    Bifrost->>Module: 获取单例实例
    Module->>Bifrost: 返回实例
    Bifrost->>Caller: 返回实例（转换为协议类型）
    Caller->>Module: 调用协议方法
    Module->>Caller: 返回结果
\`\`\`

### 如何选择？

| 场景 | 推荐方式 | 原因 |
|------|---------|------|
| 页面跳转 | Router URL | 简单直观，支持跨平台 |
| 获取数据 | Remote API | 类型安全，支持复杂对象 |
| 传递图片等复杂对象 | Remote API | URL无法传递复杂对象 |
| H5调用Native | Router URL | H5可以直接拼接URL |
| 方法调用 | Remote API | 更符合OOP思想 |

## 小结

本章我们学习了Bifrost的核心概念：

1. **业务模块 vs 功能模块**
   - 功能模块：通用库，直接import使用
   - 业务模块：业务代码，通过Bifrost通信

2. **代码依赖 vs 业务依赖**
   - Bifrost消除代码依赖，保留业务依赖

3. **三层架构**
   - 业务模块层：实现业务逻辑
   - Mediator层：定义通信协议
   - 公共层：提供基础能力

4. **模块协议**
   - 必须实现\`sharedInstance\`和\`setup\`
   - 可选实现\`priority\`和\`setupModuleSynchronously\`

5. **注册机制**
   - 在\`+load\`方法中注册
   - 在\`AppDelegate\`中初始化

6. **两种通信方式**
   - Router URL：页面跳转
   - Remote API：数据交互

        function smoothScrollTo(target) {
            const headerOffset = 80;
            const elementPosition = target.getBoundingClientRect().top;
            const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
            window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
        }

        // 锚点点击处理 - 使用捕获阶段确保优先执行
        document.addEventListener('click', function(e) {
            const link = e.target.closest('a');
            if (!link) return;

            const href = link.getAttribute('href');
            if (!href || !href.startsWith('#')) return;

            e.preventDefault();
            e.stopPropagation();

            // URL解码
            const anchor = decodeURIComponent(href.substring(1));
            const target = document.getElementById(anchor);

            if (target) {
                smoothScrollTo(target);
                history.pushState(null, null, href);
            } else {
                console.error('未找到元素 ID:', anchor);
            }
        }, true);

        // 回到顶部
        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            backToTop.classList.toggle('show', window.pageYOffset > 300);
        });
        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 页面加载时的锚点处理
        window.addEventListener('load', function() {
            if (window.location.hash) {
                setTimeout(() => {
                    const anchor = decodeURIComponent(window.location.hash.substring(1));
                    const element = document.getElementById(anchor);
                    if (element) {
                        smoothScrollTo(element);
                    }
                }, 300);
            }
        });
