        // 初始化Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',

        // 自定义渲染器 - 修复中文锚点问题
        const renderer = new marked.Renderer();

        // 覆盖heading渲染，使用与GitHub Markdown完全一致的ID生成规则
        renderer.heading = function(text, level, raw) {
            // 移除HTML标签
            const plainText = text.replace(/<[^>]+>/g, '');

            // 生成ID，匹配GitHub/Markdown的规则：
            // 1. 转小写
            // 2. 移除emoji（📖等）
            // 3. 移除标点符号（：？、。！等）
            // 4. 空格替换为-
            // 5. 保留中文、英文、数字、-
            const id = plainText
                .toLowerCase()
                // 移除emoji (U+1F000 - U+1F9FF)
                .replace(/[\u1F000-\u1F9FF]/g, '')
                // 移除中英文标点符号
                .replace(/[：？。！，、；""''（）《》【】·…—]/g, '')
                .replace(/[:?.,;!'"()\[\]<>{}]/g, '')
                // 空格替换为-
                .replace(/\s+/g, '-')
                // 多个-合并为一个
                .replace(/-+/g, '-')
                // 去掉首尾的-
                .replace(/^-|-$/g, '')
                // 去掉开头的数字和点（如果有）
                .replace(/^\d+\./, '')
                .trim();

            return `<h${level} id="${id}">${text}</h${level}>`;
        };

        // 配置marked
        marked.setOptions({
            renderer: renderer,
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            }
        });

        // Markdown内容
        const markdown = `# Bifrost 使用文档

        // 渲染
        const contentEl = document.getElementById('content');
        contentEl.innerHTML = marked.parse(markdown);

        // 处理Mermaid图表
        const mermaidBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
        mermaidBlocks.forEach((block, index) => {
            const pre = block.parentElement;
            const code = block.textContent;
            const div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = code;
            pre.replaceWith(div);
        });

        // 渲染Mermaid
        mermaid.run();

        // 回到顶部
        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            backToTop.classList.toggle('show', window.pageYOffset > 300);
        });
        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 修复锚点跳转 - 考虑固定头部的高度
        function scrollToAnchor(target) {
            const headerOffset = 80; // 固定头部高度 + 额外间距
            const elementPosition = target.getBoundingClientRect().top;
            const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

            window.scrollTo({
                top: offsetPosition,
                behavior: 'smooth'
            });
        }

        // 处理所有锚点链接点击
        document.addEventListener('click', function(e) {
            const target = e.target.closest('a[href^="#"]');
            if (target) {
                e.preventDefault();
                const id = target.getAttribute('href').substring(1);
                const element = document.getElementById(id);
                if (element) {
                    scrollToAnchor(element);
                    // 更新URL但不跳转
                    history.pushState(null, null, '#' + id);
                }
            }
        });

        // 页面加载时处理URL中的锚点
        window.addEventListener('DOMContentLoaded', function() {
            if (window.location.hash) {
                setTimeout(() => {
                    const id = window.location.hash.substring(1);
                    const element = document.getElementById(id);
                    if (element) {
                        scrollToAnchor(element);
                    }
                }, 100);
            }
        });
    </script>
