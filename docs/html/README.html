    <script>
        // 初始化Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            securityLevel: 'loose',
        });

        // 自定义渲染器
        const renderer = new marked.Renderer();

        // ID生成规则：完全匹配GitHub Markdown
        renderer.heading = function(text, level) {
            const plainText = text.replace(/<[^>]+>/g, '');

            // 完全按照Markdown锚点规则生成ID：
            // 1. 转小写
            // 2. 移除标点符号（保留英文字母、数字、中文）
            // 3. 空格替换为-
            const id = plainText
                .toLowerCase()
                // 只移除这些符号，保留字母、数字、中文
                .replace(/[：？。！，、；""''（）《》【】·…—]/g, '')
                .replace(/[?.,;!'"()\[\]<>{}]/g, '')
                // 移除emoji（使用更安全的方式）
                .replace(/[\u{1F300}-\u{1F9FF}]/gu, '')
                .replace(/[\u{2600}-\u{26FF}]/gu, '')
                .replace(/[\u{2700}-\u{27BF}]/gu, '')
                // 空格替换为-
                .replace(/\s+/g, '-')
                // 多个-合并
                .replace(/-+/g, '-')
                // 去首尾-
                .replace(/^-|-$/g, '')
                .trim();

            return `<h${{level}} id="${{id}}">${{text}}</h${{level}}>`;
        }};

        marked.setOptions({
            renderer: renderer,
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            }
        });

        // 渲染Markdown
        const contentEl = document.getElementById('content');
        const markdown = `# Bifrost 使用文档

        contentEl.innerHTML = marked.parse(markdown);

        // 处理Mermaid
        const mermaidBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
        mermaidBlocks.forEach(block => {
            const pre = block.parentElement;
            const div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = block.textContent;
            pre.replaceWith(div);
        });
        mermaid.run();

        // 滚动函数
        function smoothScrollTo(target) {
            const headerOffset = 80;
            const elementPosition = target.getBoundingClientRect().top;
            const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
            window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
        }

        // 锚点点击处理 - 使用捕获阶段确保优先执行
        document.addEventListener('click', function(e) {
            const link = e.target.closest('a');
            if (!link) return;

            const href = link.getAttribute('href');
            if (!href || !href.startsWith('#')) return;

            e.preventDefault();
            e.stopPropagation();

            // URL解码
            const anchor = decodeURIComponent(href.substring(1));
            const target = document.getElementById(anchor);

            if (target) {
                smoothScrollTo(target);
                history.pushState(null, null, href);
            } else {
                console.error('未找到元素 ID:', anchor);
            }
        }, true);

        // 回到顶部
        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            backToTop.classList.toggle('show', window.pageYOffset > 300);
        });
        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 页面加载时的锚点处理
        window.addEventListener('load', function() {
            if (window.location.hash) {
                setTimeout(() => {
                    const anchor = decodeURIComponent(window.location.hash.substring(1));
                    const element = document.getElementById(anchor);
                    if (element) {
                        smoothScrollTo(element);
                    }
                }, 300);
            }
        });
    </script>
