        // 初始化Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            securityLevel: 'loose',
        });

        // 自定义渲染器
        const renderer = new marked.Renderer();

        // ID生成规则：完全匹配GitHub Markdown
        renderer.heading = function(text, level) {
            const plainText = text.replace(/<[^>]+>/g, '');

            // 完全按照Markdown锚点规则生成ID：
            // 1. 转小写
            // 2. 移除标点符号（保留英文字母、数字、中文）
            // 3. 空格替换为-
            const id = plainText
                .toLowerCase()
                // 只移除这些符号，保留字母、数字、中文
                .replace(/[：？。！，、；""''（）《》【】·…—]/g, '')
                .replace(/[?.,;!'"()\[\]<>{}]/g, '')
                // 移除emoji（使用更安全的方式）
                .replace(/[\u{1F300}-\u{1F9FF}]/gu, '')
                .replace(/[\u{2600}-\u{26FF}]/gu, '')
                .replace(/[\u{2700}-\u{27BF}]/gu, '')
                // 空格替换为-
                .replace(/\s+/g, '-')
                // 多个-合并
                .replace(/-+/g, '-')
                // 去首尾-
                .replace(/^-|-$/g, '')
                .trim();

            return `<h${{level}} id="${{id}}">${{text}}</h${{level}}>`;
        }};

        marked.setOptions({
            renderer: renderer,
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            }

        const markdown = `# 07 - 最佳实践

## 命名规范

### URL常量命名

\`\`\`objective-c
// 格式：kRoute + 模块名 + 功能名
static NSString *const kRouteGoodsDetail = @"//goods/detail";
static NSString *const kRouteGoodsList = @"//goods/list";
static NSString *const kRouteUserProfile = @"//user/profile";
\`\`\`

### Service协议命名

\`\`\`objective-c
// 格式：模块名 + ModuleService
@protocol GoodsModuleService <NSObject>
@protocol UserModuleService <NSObject>
@protocol OrderModuleService <NSObject>
\`\`\`

### Model协议命名

\`\`\`objective-c
// 格式：模型名 + Protocol
@protocol GoodsProtocol <NSObject>
@protocol UserProtocol <NSObject>
@protocol OrderProtocol <NSObject>
\`\`\`

---

## 代码组织

### 模块内部组织

1. **Module**：模块入口，实现BifrostModuleProtocol
2. **Model**：数据模型，实现Model协议
3. **Manager**：业务逻辑管理
4. **Controller**：UI控制器
5. **Common**：模块内公共代码

### 文件组织

\`\`\`
Module/
├── Module/         # 模块入口
├── Model/          # 数据模型
├── Manager/        # 业务逻辑
├── Controller/     # UI控制器
└── Common/         # 公共代码
\`\`\`

---

## 性能优化

### 1. 缓存模块实例

\`\`\`objective-c
@interface ShoppingCartViewController ()
@property (nonatomic, strong) id<GoodsModuleService> goodsModule;
@end

- (void)viewDidLoad {
    [super viewDidLoad];
    // 缓存模块实例
    self.goodsModule = BFModule(GoodsModuleService);
}
\`\`\`

### 2. 异步初始化

\`\`\`objective-c
- (void)setup {
    // 在后台线程初始化
    dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
        [self loadData];
    });
}
\`\`\`

---

## 常见问题

### Q1: BFModule返回nil

**原因**：模块未注册或未初始化

**解决**：
1. 检查+load方法中是否调用了BFRegister
2. 检查AppDelegate中是否调用了setupAllModules
3. 检查模块类是否实现了BifrostModuleProtocol

### Q2: Router URL返回nil

**原因**：URL未注册或格式错误

**解决**：
1. 检查+load方法中是否调用了bindURL
2. 检查URL格式是否正确
3. 在bindURL的handler中添加断点调试

---

## 开发建议

1. **模块独立性**：业务模块之间不能有代码依赖
2. **接口最小化**：只暴露必要的API
3. **协议优先**：使用协议类型而不是具体类
4. **异常处理**：完善的nil检查和异常处理
5. **性能优化**：缓存模块实例，异步初始化
6. **测试完善**：编写单元测试和集成测试

详细内容请参考前面章节的示例代码。
`;
        contentEl.innerHTML = marked.parse(markdown);

        // 处理Mermaid
        const mermaidBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
        mermaidBlocks.forEach(block => {
            const pre = block.parentElement;
            const div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = block.textContent;
            pre.replaceWith(div);
        });
        mermaid.run();

        // 滚动函数
        function smoothScrollTo(target) {
            const headerOffset = 80;
            const elementPosition = target.getBoundingClientRect().top;
            const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
            window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
        }

        // 锚点点击处理 - 使用捕获阶段确保优先执行
        document.addEventListener('click', function(e) {
            const link = e.target.closest('a');
            if (!link) return;

            const href = link.getAttribute('href');
            if (!href || !href.startsWith('#')) return;

            e.preventDefault();
            e.stopPropagation();

            // URL解码
            const anchor = decodeURIComponent(href.substring(1));
            const target = document.getElementById(anchor);

            if (target) {
                smoothScrollTo(target);
                history.pushState(null, null, href);
            } else {
                console.error('未找到元素 ID:', anchor);
            }
        }, true);

        // 回到顶部
        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            backToTop.classList.toggle('show', window.pageYOffset > 300);
        });
        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 页面加载时的锚点处理
        window.addEventListener('load', function() {
            if (window.location.hash) {
                setTimeout(() => {
                    const anchor = decodeURIComponent(window.location.hash.substring(1));
                    const element = document.getElementById(anchor);
                    if (element) {
                        smoothScrollTo(element);
                    }
                }, 300);
            }
        });
    </script>
