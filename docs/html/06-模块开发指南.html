## 模块开发流程概览

创建一个Bifrost模块的完整流程：

\`\`\`mermaid
graph TD
    A[需求分析] --> B[设计模块接口]

    F --> G[编写测试]
    G --> H[集成到主工程]
    H --> I[验证功能]

    style D fill:#95e1d3

\`\`\`

**关键步骤：**
1. **需求分析**：明确模块要实现的功能
2. **设计接口**：定义模块对外提供的API
3. **创建工程**：创建独立的模块工程
4. **实现功能**：编写业务逻辑代码
5. **测试验证**：确保模块功能正常
6. **集成主工程**：将模块集成到App中

### 各层职责说明

\`\`\`mermaid
graph TB
    subgraph "模块分层架构"
        A[Module层] -->|初始化| B[Manager层]
        B -->|管理| C[Model层]

**各层职责：**
- **Module层**：模块入口，实现BifrostModuleProtocol和ModuleService协议
- **Model层**：数据模型，实现Model协议
- **Manager层**：业务逻辑，网络请求、数据处理、缓存管理
- **Controller层**：UI控制器，处理用户交互
- **View层**：UI视图，展示数据
- **Common层**：模块内公共代码，不对外暴露

## 创建模块工程

### 步骤1：在Xcode中创建模块

#### 1.1 创建静态库Target（代码）

1. 打开Xcode项目
2. 选择 File -> New -> Target
3. 选择 iOS -> Static Library
4. 命名为 \`Order\`（不要加Module后缀）
5. 语言选择 Objective-C

#### 1.2 创建Bundle Target（资源）

1. 选择 File -> New -> Target
2. 选择 macOS -> Bundle
3. 命名为 \`OrderBundle\`
4. 删除macOS相关设置，将Base SDK改为iOS

### 步骤2：配置Podfile

\`\`\`ruby
# 主App
target 'YourApp' do
  use_frameworks!

  # Bifrost核心库
  pod 'Bifrost'

  # 依赖Common和Mediator
  pod 'Common', :path => './Modules/Common'
  pod 'Mediator', :path => './Modules/Mediator'

  # 业务模块
  pod 'Order', :path => './Modules/Order'
  pod 'Goods', :path => './Modules/Goods'
  pod 'User', :path => './Modules/User'
end

# 订单模块
target 'Order' do
  # 只依赖Common和Mediator，不依赖其他业务模块
  pod 'Common', :path => './Modules/Common'
  pod 'Mediator', :path => './Modules/Mediator'
end
\`\`\`

### 步骤3：创建模块的Podspec

在\`Modules/Order/\`目录下创建\`Order.podspec\`：

\`\`\`ruby
Pod::Spec.new do |s|
  s.name         = "Order"
  s.version      = "1.0.0"
  s.summary      = "订单模块"
  s.homepage     = "https://github.com/youzan/Bifrost"
  s.license      = "MIT"
  s.author       = { "Your Name" => "your@email.com" }
  s.platform     = :ios, "8.0"
  s.source       = { :git => "", :tag => s.version }

  # 代码文件
  s.source_files  = "Order/**/*.{h,m}"
  s.public_header_files = "Order/Module/*.h"

  # 资源文件
  s.resources = "OrderBundle/Resource/**/*"

  # 依赖
  s.dependency "Bifrost"
  s.dependency "Common"
  s.dependency "Mediator"

  # 其他第三方库
  s.dependency "AFNetworking"
  s.dependency "YYModel"
end
\`\`\`

## 实现模块功能

### 步骤1：定义ModuleService协议

在\`Mediator/ModuleService/\`下创建\`OrderModuleService.h\`：

\`\`\`objective-c
//
//  OrderModuleService.h
//  Mediator
//
//  订单模块服务协议
//

#ifndef OrderModuleService_h
#define OrderModuleService_h

#import <BifrostHeader.h>
#import <UIKit/UIKit.h>

NS_ASSUME_NONNULL_BEGIN

///<v1.0>

#pragma mark - Notifications
/// 订单状态变化通知
static NSString *const kOrderStatusDidChangeNotification = @"OrderStatusDidChangeNotification";

#pragma mark - URL routers
/// 订单列表页面
static NSString *const kRouteOrderList = @"//order/list";

/// 订单详情页面
static NSString *const kRouteOrderDetail = @"//order/detail";
static NSString *const kRouteOrderDetailParamOrderId = @"orderId";

#pragma mark - Model Protocols

/// 订单状态枚举
typedef NS_ENUM(NSInteger, OrderStatus) {
    OrderStatusPending = 0,     // 待支付
    OrderStatusPaid = 1,        // 已支付
    OrderStatusShipped = 2,     // 已发货
    OrderStatusCompleted = 3,   // 已完成
    OrderStatusCancelled = 4    // 已取消
};

/// 订单数据协议
@protocol OrderProtocol <NSObject>
@required
- (NSString*)orderId;
- (NSString*)userId;

- (CGFloat)totalPrice;

/// 订单模块服务协议
@protocol OrderModuleService <NSObject>

@required

- (BOOL)cancelOrder:(NSString*)orderId;

/// 确认收货

@end

NS_ASSUME_NONNULL_END

创建\`Order/Manager/OrderManager.m\`：

\`\`\`objective-c
//
//  OrderManager.m
//  Order
//

#import "OrderManager.h"
#import "OrderModel.h"
#import "OrderNetworkManager.h"
#import "OrderCacheManager.h"

@interface OrderManager ()
@property (nonatomic, strong) NSMutableArray<OrderModel*> *orderCache;
@property (nonatomic, strong) OrderNetworkManager *networkManager;
@property (nonatomic, strong) OrderCacheManager *cacheManager;
@end

@implementation OrderManager

+ (instancetype)sharedInstance {
    static OrderManager *instance = nil;
    static dispatch_once_t onceToken;
    dispatch_once(&onceToken, ^{
        instance = [[self alloc] init];
    });
    return instance;
}

- (instancetype)init {
    if (self = [super init]) {
        _orderCache = [NSMutableArray array];
        _networkManager = [[OrderNetworkManager alloc] init];
        _cacheManager = [[OrderCacheManager alloc] init];

        // 从缓存加载数据
        [self loadOrdersFromCache];
    }
    return self;
}

- (void)loadOrdersFromCache {
    NSArray *cachedOrders = [self.cacheManager loadOrders];
    if (cachedOrders) {
        [self.orderCache addObjectsFromArray:cachedOrders];
    }
}

- (NSArray<id<OrderProtocol>>*)allOrders {
    return [self.orderCache copy];
}

- (id<OrderProtocol>)orderById:(NSString *)orderId {
    if (!orderId || orderId.length == 0) {
        return nil;
    }

    for (OrderModel *order in self.orderCache) {
        if ([order.orderId isEqualToString:orderId]) {
            return order;
        }
    }

    return nil;
}

- (void)createOrderWithGoodsIds:(NSArray<NSString *> *)goodsIds
                     completion:(void (^)(id<OrderProtocol>, NSError *))completion {

    // 参数验证
    if (!goodsIds || goodsIds.count == 0) {
        NSError *error = [NSError errorWithDomain:@"OrderModule"
                                             code:-1
                                         userInfo:@{NSLocalizedDescriptionKey: @"商品列表不能为空"}];
        if (completion) {
            completion(nil, error);
        }
        return;
    }

    // 调用网络请求创建订单
    [self.networkManager createOrderWithGoodsIds:goodsIds completion:^(OrderModel *order, NSError *error) {
        if (error) {
            if (completion) {
                completion(nil, error);
            }
            return;
        }

        // 添加到缓存
        [self.orderCache addObject:order];
        [self.cacheManager saveOrders:self.orderCache];

        // 发送通知
        [[NSNotificationCenter defaultCenter] postNotificationName:kOrderStatusDidChangeNotification
                                                            object:nil
                                                          userInfo:@{@"orderId": order.orderId,
                                                                     @"status": @(order.status)}];

        if (completion) {
            completion(order, nil);
        }
    }];
}

- (BOOL)cancelOrder:(NSString *)orderId {
    OrderModel *order = (OrderModel*)[self orderById:orderId];
    if (!order) {
        return NO;
    }

    // 只有待支付状态才能取消
    if (order.status != OrderStatusPending) {
        return NO;
    }

    // 更新状态
    order.status = OrderStatusCancelled;
    order.updateTime = [NSDate date];

    // 保存到缓存
    [self.cacheManager saveOrders:self.orderCache];

    // 发送通知
    [[NSNotificationCenter defaultCenter] postNotificationName:kOrderStatusDidChangeNotification
                                                        object:nil
                                                      userInfo:@{@"orderId": order.orderId,
                                                                 @"status": @(order.status)}];

    return YES;
}

- (BOOL)confirmOrder:(NSString *)orderId {
    OrderModel *order = (OrderModel*)[self orderById:orderId];
    if (!order) {
        return NO;
    }

    // 只有已发货状态才能确认收货
    if (order.status != OrderStatusShipped) {
        return NO;
    }

    // 更新状态
    order.status = OrderStatusCompleted;
    order.updateTime = [NSDate date];

    // 保存到缓存
    [self.cacheManager saveOrders:self.orderCache];

    // 发送通知
    [[NSNotificationCenter defaultCenter] postNotificationName:kOrderStatusDidChangeNotification
                                                        object:nil
                                                      userInfo:@{@"orderId": order.orderId,
                                                                 @"status": @(order.status)}];

    return YES;
}

@end

#import "OrderModule.h"
#import "OrderManager.h"
#import "OrderListViewController.h"
#import "OrderDetailViewController.h"

@implementation OrderModule

#pragma mark - 模块注册

+ (void)load {
    // 注册模块
    BFRegister(OrderModuleService);

    // 注册Router URL
    [self registerRouterURLs];
}

+ (void)registerRouterURLs {
    // 注册订单列表页面
    [Bifrost bindURL:kRouteOrderList toHandler:^id _Nullable(NSDictionary * _Nullable parameters) {
        OrderListViewController *vc = [[OrderListViewController alloc] init];
        return vc;
    }];

    // 注册订单详情页面
    [Bifrost bindURL:kRouteOrderDetail toHandler:^id _Nullable(NSDictionary * _Nullable parameters) {
        NSString *orderId = parameters[kRouteOrderDetailParamOrderId];
        if (!orderId) {
            NSLog(@"[OrderModule] ❌ orderId不能为空");
            return nil;
        }

        OrderDetailViewController *vc = [[OrderDetailViewController alloc] init];
        vc.orderId = orderId;
        return vc;
    }];
}

#pragma mark - BifrostModuleProtocol

+ (instancetype)sharedInstance {
    static OrderModule *instance = nil;
    static dispatch_once_t onceToken;
    dispatch_once(&onceToken, ^{
        instance = [[self alloc] init];
    });
    return instance;
}

- (void)setup {
    NSLog(@"[OrderModule] 模块初始化");

    // 初始化OrderManager
    [[OrderManager sharedInstance] allOrders];
}

+ (NSUInteger)priority {
    return 100;  // 默认优先级

#pragma mark - OrderModuleService

- (NSArray<id<OrderProtocol>> *)userOrders {

}

                     completion:(void (^)(id<OrderProtocol>, NSError *))completion {
    [[OrderManager sharedInstance] createOrderWithGoodsIds:goodsIds completion:completion];
}

- (BOOL)cancelOrder:(NSString *)orderId {
    return [[OrderManager sharedInstance] cancelOrder:orderId];
}

- (BOOL)confirmOrder:(NSString *)orderId {
    return [[OrderManager sharedInstance] confirmOrder:orderId];

    NSArray *orders = [self.orderModule userOrders];
    XCTAssertNotNil(orders, @"订单列表不应为nil");

/// 测试获取单个订单
- (void)testGetOrderById {
    // 先创建订单
    NSArray *goodsIds = @[@"1001", @"1002"];
    XCTestExpectation *expectation = [self expectationWithDescription:@"创建订单"];

    [self.orderModule createOrderWithGoodsIds:goodsIds completion:^(id<OrderProtocol> order, NSError *error) {
        XCTAssertNil(error, @"不应有错误");
        XCTAssertNotNil(order, @"订单不应为nil");

        // 再根据ID获取订单
        id<OrderProtocol> fetchedOrder = [self.orderModule orderById:order.orderId];
        XCTAssertNotNil(fetchedOrder, @"获取的订单不应为nil");
        XCTAssertEqualObjects(fetchedOrder.orderId, order.orderId, @"订单ID应该一致");

        [expectation fulfill];
    }];

    [self waitForExpectationsWithTimeout:5.0 handler:nil];
}

/// 测试取消订单
- (void)testCancelOrder {
    // 创建订单
    NSArray *goodsIds = @[@"1001"];
    XCTestExpectation *expectation = [self expectationWithDescription:@"取消订单"];

    [self.orderModule createOrderWithGoodsIds:goodsIds completion:^(id<OrderProtocol> order, NSError *error) {
        // 取消订单
        BOOL success = [self.orderModule cancelOrder:order.orderId];
        XCTAssertTrue(success, @"取消订单应该成功");

        // 验证状态
        id<OrderProtocol> cancelledOrder = [self.orderModule orderById:order.orderId];
        XCTAssertEqual(cancelledOrder.status, OrderStatusCancelled, @"订单状态应为已取消");

        [expectation fulfill];
    }];

    [self waitForExpectationsWithTimeout:5.0 handler:nil];
}
