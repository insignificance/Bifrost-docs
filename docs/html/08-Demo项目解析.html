        // 覆盖heading渲染，使用与GitHub Markdown完全一致的ID生成规则
        renderer.heading = function(text, level, raw) {
            // 移除HTML标签
            const plainText = text.replace(/<[^>]+>/g, '');

            // 生成ID，匹配GitHub/Markdown的规则：
            // 1. 转小写
            // 2. 移除emoji（📖等）
            // 3. 移除标点符号（：？、。！等）
            // 4. 空格替换为-
            // 5. 保留中文、英文、数字、-
            const id = plainText
                .toLowerCase()
                // 移除emoji (U+1F000 - U+1F9FF)
                .replace(/[\u1F000-\u1F9FF]/g, '')
                // 移除中英文标点符号
                .replace(/[：？。！，、；""''（）《》【】·…—]/g, '')
                .replace(/[:?.,;!'"()\[\]<>{}]/g, '')
                // 空格替换为-
                .replace(/\s+/g, '-')
                // 多个-合并为一个
                .replace(/-+/g, '-')
                // 去掉首尾的-
                .replace(/^-|-$/g, '')
                // 去掉开头的数字和点（如果有）
                .replace(/^\d+\./, '')
                .trim();

            return `<h${level} id="${id}">${text}</h${level}>`;
        };

## Demo项目概述

Bifrost Demo是一个模拟电商应用的示例项目，展示了如何使用Bifrost实现业务模块化架构。

### 包含的模块

- **Home模块**：首页，展示商品推荐
- **Goods模块**：商品管理，提供商品列表和详情
- **Shop模块**：店铺管理
- **Sale模块**：销售管理，包含购物车功能
- **Common模块**：公共组件和工具类
- **Mediator模块**：中介层，定义所有模块的Service协议

---

## 项目结构

\`\`\`
BifrostDemo/
├── App/                        # 主应用
│   └── App.xcodeproj
├── Modules/                    # 业务模块
│   ├── Home/                   # 首页模块
│   ├── Goods/                  # 商品模块
│   ├── Shop/                   # 店铺模块
│   ├── Sale/                   # 销售模块
│   ├── Common/                 # 公共模块
│   └── Mediator/               # 中介模块
├── Pods/                       # CocoaPods依赖
├── Podfile                     # CocoaPods配置
└── BifrostDemo.xcworkspace     # 工作空间
\`\`\`

## 模块功能说明

### Home模块

**功能**：
- 展示首页
- 显示热卖商品
- 跳转到商品详情

**关键代码**：
\`\`\`objective-c
// 跳转到商品详情
NSString *url = BFStr(@"%@?%@=%@", kRouteGoodsDetail, kRouteGoodsDetailParamId, goodsId);
UIViewController *vc = [Bifrost handleURL:url];
\`\`\`

### Goods模块

**功能**：
- 提供商品列表
- 提供商品详情
- 提供商品查询API

**关键代码**：
\`\`\`objective-c
// 实现GoodsModuleService协议
- (NSArray<id<GoodsProtocol>>*)allGoodsList {
    return [self.goodsCache copy];
}
\`\`\`

### Sale模块

**功能**：
- 购物车管理
- 调用商品模块获取商品信息

**关键代码**：
\`\`\`objective-c
// 调用商品模块
id<GoodsModuleService> goodsModule = BFModule(GoodsModuleService);
id<GoodsProtocol> goods = [goodsModule goodsById:goodsId];
\`\`\`

### 运行步骤

1. **安装依赖**
\`\`\`bash
cd Demo
pod install
\`\`\`

2. **打开工作空间**
\`\`\`bash
open BifrostDemo.xcworkspace
\`\`\`

3. **选择scheme**
- 选择BifrostDemo scheme

4. **运行项目**
- 按Cmd+R运行

### 调试技巧

1. **查看模块注册**
\`\`\`objective-c
// 在AppDelegate中打印所有注册的模块
NSArray *modules = [Bifrost allRegisteredModules];
NSLog(@"已注册的模块：%@", modules);
\`\`\`

2. **调试Router URL**
\`\`\`objective-c
// 检查URL是否可以处理
if ([Bifrost canHandleURL:url]) {
    NSLog(@"URL可以处理：%@", url);
} else {
    NSLog(@"URL无法处理：%@", url);
}
\`\`\`

3. **调试Remote API**
\`\`\`objective-c
// 检查模块是否存在
id<GoodsModuleService> goodsModule = BFModule(GoodsModuleService);
if (goodsModule) {
    NSLog(@"商品模块已注册");
} else {
    NSLog(@"商品模块未注册");
}
\`\`\`

        // 修复锚点跳转 - 考虑固定头部的高度
        function scrollToAnchor(target) {
            const headerOffset = 80;
            const elementPosition = target.getBoundingClientRect().top;
            const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

            window.scrollTo({
                top: offsetPosition,
                behavior: 'smooth'
            });
        }

        // 处理所有锚点链接点击
        contentEl.addEventListener('click', function(e) {
            const link = e.target.closest('a[href^="#"]');
            if (link) {
                e.preventDefault();
                e.stopPropagation();

                // 关键修复：解码URL编码的锚点
                const rawHash = link.getAttribute('href').substring(1);
                const hash = decodeURIComponent(rawHash);
                const target = document.getElementById(hash);

                console.log('🖱️ 点击链接:', link.textContent);
                console.log('📍 原始锚点:', rawHash);
                console.log('📍 解码后:', hash);
                console.log('🎯 目标:', target);

                if (target) {
                    scrollToAnchor(target);
                    history.pushState(null, null, '#' + hash);
                } else {
                    console.error('❌ 未找到ID:', hash);
                }

                return false;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 页面加载时处理URL中的锚点
        if (window.location.hash) {
            setTimeout(() => {
                const rawHash = window.location.hash.substring(1);
                const hash = decodeURIComponent(rawHash);
                const element = document.getElementById(hash);
                if (element) {
                    scrollToAnchor(element);
                }
            }, 200);
        }
    </script>
</body>
</html>
