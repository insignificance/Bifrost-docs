        // 初始化Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            securityLevel: 'loose',
        });

        // 自定义渲染器 - 修复中文锚点问题
        const renderer = new marked.Renderer();

        // 覆盖heading渲染，使用与GitHub Markdown完全一致的ID生成规则
        renderer.heading = function(text, level, raw) {
            // 移除HTML标签
            const plainText = text.replace(/<[^>]+>/g, '');

            // 生成ID，完全匹配GitHub Markdown规则
            const id = plainText
                .toLowerCase()
                // 移除emoji（使用正确的Unicode范围）
                .replace(/[\u{1F300}-\u{1F9FF}]/gu, '')
                .replace(/[\u{2600}-\u{26FF}]/gu, '')
                .replace(/[\u{2700}-\u{27BF}]/gu, '')
                // 移除中英文标点符号
                .replace(/[：？。！，、；""''（）《》【】·…—]/g, '')
                .replace(/[?.,;!'"()\[\]<>{}]/g, '')
                // 空格替换为-
                .replace(/\s+/g, '-')
                // 多个-合并为一个
                .replace(/-+/g, '-')
                // 去掉首尾的-
                .replace(/^-|-$/g, '')
                .trim();

            return `<h${level} id="${id}">${text}</h${level}>`;
        };

        // 配置marked
        marked.setOptions({
            renderer: renderer,
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            }
        });

        // Markdown内容
        const markdown = `# 07 - 最佳实践

本章总结Bifrost开发中的最佳实践、注意事项和常见问题解决方案。

## 命名规范

### URL常量命名

\`\`\`objective-c
// 格式：kRoute + 模块名 + 功能名
static NSString *const kRouteGoodsDetail = @"//goods/detail";
static NSString *const kRouteGoodsList = @"//goods/list";
static NSString *const kRouteUserProfile = @"//user/profile";
\`\`\`

### Service协议命名

\`\`\`objective-c
// 格式：模块名 + ModuleService
@protocol GoodsModuleService <NSObject>
@protocol UserModuleService <NSObject>
@protocol OrderModuleService <NSObject>
\`\`\`

### Model协议命名

\`\`\`objective-c
// 格式：模型名 + Protocol
@protocol GoodsProtocol <NSObject>
@protocol UserProtocol <NSObject>
@protocol OrderProtocol <NSObject>
\`\`\`

---

## 代码组织

### 模块内部组织

1. **Module**：模块入口，实现BifrostModuleProtocol
2. **Model**：数据模型，实现Model协议
3. **Manager**：业务逻辑管理
4. **Controller**：UI控制器
5. **Common**：模块内公共代码

### 文件组织

\`\`\`
Module/
├── Module/         # 模块入口
├── Model/          # 数据模型
├── Manager/        # 业务逻辑
├── Controller/     # UI控制器
└── Common/         # 公共代码
\`\`\`

---

## 性能优化

### 1. 缓存模块实例

\`\`\`objective-c
@interface ShoppingCartViewController ()
@property (nonatomic, strong) id<GoodsModuleService> goodsModule;
@end

- (void)viewDidLoad {
    [super viewDidLoad];
    // 缓存模块实例
    self.goodsModule = BFModule(GoodsModuleService);
}
\`\`\`

### 2. 异步初始化

\`\`\`objective-c
- (void)setup {
    // 在后台线程初始化
    dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
        [self loadData];
    });
}
\`\`\`

---

## 常见问题

### Q1: BFModule返回nil

**原因**：模块未注册或未初始化

**解决**：
1. 检查+load方法中是否调用了BFRegister
2. 检查AppDelegate中是否调用了setupAllModules
3. 检查模块类是否实现了BifrostModuleProtocol

### Q2: Router URL返回nil

**原因**：URL未注册或格式错误

**解决**：
1. 检查+load方法中是否调用了bindURL
2. 检查URL格式是否正确
3. 在bindURL的handler中添加断点调试

---

## 开发建议

1. **模块独立性**：业务模块之间不能有代码依赖
2. **接口最小化**：只暴露必要的API
3. **协议优先**：使用协议类型而不是具体类
4. **异常处理**：完善的nil检查和异常处理
5. **性能优化**：缓存模块实例，异步初始化
6. **测试完善**：编写单元测试和集成测试

详细内容请参考前面章节的示例代码。
`;

        setTimeout(() => {
            console.log('=== 生成的标题ID ===');
            contentEl.querySelectorAll('h1[id], h2[id], h3[id], h4[id]').forEach(h => {
                console.log(`${h.tagName} id="${h.id}" text="${h.textContent}"`);
            });

            console.log('\n=== 链接的锚点 ===');
            contentEl.querySelectorAll('a[href^="#"]').forEach(a => {

            });
        }, 200);

        // 处理Mermaid图表
        const mermaidBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
        mermaidBlocks.forEach((block, index) => {
            const pre = block.parentElement;
            const code = block.textContent;
            const div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = code;
            pre.replaceWith(div);
        });

        // 渲染Mermaid
        mermaid.run();

        // 修复锚点跳转 - 考虑固定头部的高度
        function scrollToAnchor(target) {
            const headerOffset = 80;
            const elementPosition = target.getBoundingClientRect().top;
            const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

            window.scrollTo({
                top: offsetPosition,
                behavior: 'smooth'
            });
        }

        // 处理所有锚点链接点击
        contentEl.addEventListener('click', function(e) {
            const link = e.target.closest('a[href^="#"]');
            if (link) {
                e.preventDefault();
                e.stopPropagation();

                // 关键修复：解码URL编码的锚点
                const rawHash = link.getAttribute('href').substring(1);
                const hash = decodeURIComponent(rawHash);
                const target = document.getElementById(hash);

                console.log('🖱️ 点击链接:', link.textContent);
                console.log('📍 原始锚点:', rawHash);
                console.log('📍 解码后:', hash);
                console.log('🎯 目标:', target);

                if (target) {
                    scrollToAnchor(target);
                    history.pushState(null, null, '#' + hash);
                } else {
                    console.error('❌ 未找到ID:', hash);
                }

                return false;
            }
        }, true);

        // 回到顶部
        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            backToTop.classList.toggle('show', window.pageYOffset > 300);
        });
        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 页面加载时处理URL中的锚点
        if (window.location.hash) {
            setTimeout(() => {
                const rawHash = window.location.hash.substring(1);
                const hash = decodeURIComponent(rawHash);
                const element = document.getElementById(hash);
                if (element) {
                    scrollToAnchor(element);
                }
            }, 200);
        }
    </script>
